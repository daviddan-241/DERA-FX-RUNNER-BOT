# Render.com deployment — free Web Service.
# The bot also runs a health server on $PORT (200 OK) so:
#   • Render's health check passes
#   • UptimeRobot pings keep the free web service from sleeping
services:
  - type: web
    name: private-alpha-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: WALLET_SEED
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: MIN_CONFIRM_LEVEL
        value: finalized
      - key: TX_WINDOW_HOURS
        value: "48"
      - key: NEWBIE_PRICE
        value: "1"
      - key: NEWBIE_DAYS
        value: "30"
      - key: BEGINNER_PRICE
        value: "2"
      - key: BEGINNER_DAYS
        value: "30"
      - key: PRO_PRICE
        value: "4"
      - key: PRO_DAYS
        value: "30"
      - key: ELITE_PRICE
        value: "8"
      - key: ELITE_DAYS
        value: "60"
      - key: BOT_MONTH_NAME
        value: VIP Access
      - key: BOT_MONTH_PRICE
        value: "5"
      - key: BOT_MONTH_DAYS
        value: "30"
      - key: CHANNEL_PASSES
        sync: false
      - key: SUPPORT_LINK
        sync: false
      - key: PUBLIC_CHANNEL_LINK
        value: https://t.me/drakeinsider
      - key: TZ
        value: Africa/Lagos
      - key: FREE_REPORTS
        value: "3"
      - key: REF_PERCENT
        value: "50"
      - key: REMIND_BEFORE_HOURS
        value: "48,24,6,1"
      - key: LIMIT_MAX_ATTEMPTS
        value: "3"
      - key: AD_LINE
        value: Trade, Earn & Launch on Vyper
